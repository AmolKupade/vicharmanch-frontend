<div class="min-h-screen bg-[#f8fafc] dark:bg-[#050505] flex items-center justify-center p-6 relative overflow-hidden font-sans transition-colors duration-500">
  
  <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] bg-indigo-500/10 dark:bg-indigo-600/20 rounded-full blur-[120px]"></div>
  <div class="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-purple-500/5 dark:bg-purple-600/10 rounded-full blur-[120px]"></div>

  <div class="relative w-full max-w-[450px] z-10 animate-fade-in" style="margin-top: 40px;">
    
    <div class="p-[1px] rounded-[2.5rem] bg-gradient-to-b from-slate-200 via-slate-100 to-transparent dark:from-white/20 dark:via-white/5 dark:to-transparent shadow-2xl transition-all">
      
      <div class="bg-white/80 dark:bg-[#0c0c0c]/80 backdrop-blur-3xl rounded-[2.45rem] p-10 md:p-12 border border-slate-200/50 dark:border-white/5 shadow-xl">
        
        <div class="text-center mb-10">
          <div class="w-14 h-14 bg-indigo-600 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-xl shadow-indigo-600/30 rotate-3 hover:rotate-0 transition-transform duration-500">
            <span class="text-2xl font-black text-white italic">V</span>
          </div>
          <h2 class="text-3xl font-black text-slate-900 dark:text-white tracking-tighter mb-2">
            {{ isLogin ? 'Welcome Back' : 'Create Account' }}
          </h2>
          <p class="text-slate-500 dark:text-slate-400 text-xs font-bold uppercase tracking-widest">
            Join the Vichar Circle
          </p>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
          <button class="flex items-center justify-center gap-3 py-3 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl hover:bg-slate-100 dark:hover:bg-white/10 transition-all active:scale-95 group">
             <span class="text-[10px] font-black text-slate-500 dark:text-slate-300 uppercase tracking-widest group-hover:text-slate-900 dark:group-hover:text-white transition">Google</span>
          </button>
          <button class="flex items-center justify-center gap-3 py-3 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl hover:bg-slate-100 dark:hover:bg-white/10 transition-all active:scale-95 group">
             <span class="text-[10px] font-black text-slate-500 dark:text-slate-300 uppercase tracking-widest group-hover:text-slate-900 dark:group-hover:text-white transition">Twitter</span>
          </button>
        </div>

        <div class="flex items-center gap-4 mb-8">
          <div class="h-[1px] flex-1 bg-slate-200 dark:bg-white/10"></div>
          <span class="text-[9px] font-black text-slate-400 dark:text-slate-600 uppercase tracking-[0.3em]">Email</span>
          <div class="h-[1px] flex-1 bg-slate-200 dark:bg-white/10"></div>
        </div>

        <form class="space-y-5">
          <div *ngIf="!isLogin" class="space-y-2">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 dark:text-slate-500 ml-1">Full Name</label>
            <input type="text" class="w-full px-5 py-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl outline-none focus:border-indigo-600 focus:ring-4 focus:ring-indigo-600/5 dark:focus:ring-indigo-600/10 transition-all text-slate-900 dark:text-white placeholder:text-slate-300 dark:placeholder:text-slate-700" placeholder="Amit Patil">
          </div>

          <div class="space-y-2">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 dark:text-slate-500 ml-1">Email</label>
            <input type="email" class="w-full px-5 py-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl outline-none focus:border-indigo-600 focus:ring-4 focus:ring-indigo-600/5 transition-all text-slate-900 dark:text-white placeholder:text-slate-300 dark:placeholder:text-slate-700" placeholder="hello@vicharmanch.com">
          </div>

          <div class="space-y-2">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 dark:text-slate-500 ml-1">Password</label>
            <input type="password" class="w-full px-5 py-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl outline-none focus:border-indigo-600 focus:ring-4 focus:ring-indigo-600/5 transition-all text-slate-900 dark:text-white placeholder:text-slate-300 dark:placeholder:text-slate-700" placeholder="••••••••">
          </div>

          <div class="pt-4 relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl blur opacity-20 group-hover:opacity-60 transition duration-500"></div>
            <button class="relative w-full py-5 bg-indigo-600 text-white font-black rounded-2xl text-xs uppercase tracking-[0.2em] shadow-xl hover:bg-indigo-500 transition-all active:scale-95">
              {{ isLogin ? 'Sign In Now' : 'Get Started' }}
            </button>
          </div>
        </form>

        <p class="text-center mt-10 text-xs text-slate-500">
          {{ isLogin ? "New Here?" : "Already a member?" }}
          <a (click)="toggleAuth()" class="text-indigo-600 dark:text-indigo-400 font-black hover:underline cursor-pointer ml-1">
            {{ isLogin ? 'Sign Up' : 'Sign In' }}
          </a>
        </p>

      </div>
    </div>
  </div>

  <a routerLink="/" class="absolute top-10 left-10 text-slate-400 dark:text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors flex items-center gap-2 group cursor-pointer z-20">
    <span class="text-xl group-hover:-translate-x-1 transition-transform">←</span>
    <span class="text-[10px] font-black uppercase tracking-widest">Home</span>
  </a>

</div>
