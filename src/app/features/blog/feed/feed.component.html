<div class="bg-gray-50 min-h-screen pb-20"> <header class="bg-white/80 backdrop-blur-md border-b border-gray-100 p-4 sticky top-0 z-40 flex justify-between items-center">
    <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">VicharManch</h1>
    <div class="h-8 w-8 rounded-full bg-gray-200 overflow-hidden">
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User">
    </div>
  </header>

  <div class="max-w-md mx-auto p-4 space-y-6">
    
    <div *ngIf="isLoading" class="space-y-4">
      <div class="bg-white p-4 rounded-3xl shadow-sm h-40 animate-pulse"></div>
      <div class="bg-white p-4 rounded-3xl shadow-sm h-40 animate-pulse"></div>
    </div>

    <div *ngFor="let blog of blogs()" class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden transition-all hover:shadow-md">
      
      <div class="p-4 flex items-center space-x-3">
        <div class="h-10 w-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold uppercase">
          {{ blog.user?.name?.charAt(0) || 'U' }}
        </div>
        <div>
          <p class="text-sm font-bold text-gray-900">{{ blog.user?.name || 'Unknown User' }}</p>
          <p class="text-xs text-gray-500">{{ blog.createdAt | date:'mediumDate' }}</p>
        </div>
        <span *ngIf="blog.status === 'pending'" class="ml-auto px-2 py-1 text-xs bg-yellow-100 text-yellow-700 rounded-full">Pending</span>
      </div>
      
      <div class="px-4 pb-2">
        <h3 class="font-bold text-lg mb-2 text-gray-800">{{ blog.title }}</h3>
        <p class="text-gray-600 text-sm leading-relaxed line-clamp-3">
          {{ blog.content }}
        </p>
      </div>

      <div *ngIf="blog.image" class="w-full h-48 bg-gray-100 mt-2">
        <img [src]="blog.image" class="w-full h-full object-cover">
      </div>

      <div class="p-4 border-t border-gray-50 flex items-center justify-between text-gray-500">
        <button class="flex items-center space-x-1 hover:text-red-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
          <span class="text-sm font-medium">Like</span>
        </button>
        <button class="flex items-center space-x-1 hover:text-blue-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
          <span class="text-sm font-medium">Comment</span>
        </button>
        <button class="flex items-center space-x-1 hover:text-green-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
          <span class="text-sm font-medium">Share</span>
        </button>
      </div>
    </div>
    
  </div>

  <app-navbar></app-navbar>

</div>
